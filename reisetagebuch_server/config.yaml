name: Reisetagebuch Server
version: "0.3.0"
slug: reisetagebuch_server
description: Login und Synchronisation für die Reisekarte (PocketBase hinter HTTPS)
url: https://github.com/bLammT/ha-addons/tree/main/reisetagebuch_server
arch:
  - aarch64
  - amd64
init: false
startup: application
# SQLite-Datenbank: für ein konsistentes Backup kurz anhalten.
backup: cold
map:
  - type: ssl
ports:
  8091/tcp: 8091
ports_description:
  8091/tcp: HTTPS für App und Admin-Oberfläche (/_/)
webui: "https://[HOST]:[PORT:8091]/_/"
watchdog: "tcp://[HOST]:[PORT:8091]"
options:
  certfile: fullchain.pem
  keyfile: privkey.pem
schema:
  certfile: str
  keyfile: str
